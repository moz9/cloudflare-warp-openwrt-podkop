name: Build and check IPK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Test prerequisites
        run: sudo apt-get update && sudo apt-get install -y gettext jq
      - name: Verified Zig toolchain
        run: |
          curl -fsSL https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz -o /tmp/zig.tar.xz
          echo '02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239  /tmp/zig.tar.xz' | sha256sum -c -
          tar -xf /tmp/zig.tar.xz -C /tmp
      - name: Prepare pinned backend and build
        run: |
          python scripts/prepare_backend.py --zig /tmp/zig-x86_64-linux-0.15.2/zig
          python scripts/build_ipk.py --backend .build/backend
          python scripts/build_apk.py
      - name: Check packaging and syntax
        run: |
          python tests/test_ipk.py
          python tests/test_apk.py
          sh tests/run.sh
          sh tests/test_scout_route.sh "$PWD/root/usr/libexec/warp-common"
      - name: Check operation ownership
        run: sh tests/test_concurrency.sh "$PWD/root/usr/libexec/warp-common"
      - name: Check stability result classification
        run: python tests/test_stability.py
      - name: Check autotune ranking
        run: |
          python tests/test_autotune.py
          python tests/test_speed.py
          python tests/test_quick.py
          python tests/test_review.py
          node --test tests/test_installer.cjs tests/test_setup.cjs tests/test_autotune_view.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: opkg-aarch64-cortex-a53
          path: dist-podkop/
